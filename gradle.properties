# Project-wide Gradle settings.

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable configuration caching and parallel builds for faster local + CI builds.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# No Jetifier: everything on the classpath is already AndroidX-native.
android.enableJetifier=false

# skein-xtov.23.16 (UT-2), docs/ux/UX_TEST_PLAN.md §4.1: goldens are
# committed under ux-baselines/<module-dir>/ (each module's `roborazzi {
# outputDir }`), so a relative `captureRoboImage(filePath)` must resolve
# against that directory, not the JVM's working directory.
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
# Half-scale goldens (the NiA precedent: ~136 PNGs in ~4.9 MB); keeps the
# ~630-image budget under the 40/50 MiB warn/fail line (§4.4).
roborazzi.record.resizeScale=0.5
