name: Emulator instrumented tests

# E1.I3: on-demand + nightly instrumented lane. Deliberately NOT run on every
# push/PR — booting an emulator is slow and this proves device-level behavior
# (native library loading, SQLite stack) rather than gating every commit.
#
# Uses the `dev` flavor, not `foss`: app/build.gradle.kts only builds
# arm64-v8a native libs for the `foss` flavor (see productFlavors), so a
# foss build has no x86_64 .so to load on this emulator. `dev` ships both
# arm64-v8a and x86_64 abiFilters.
on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC nightly.
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: Instrumented tests (API 35, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a pre-licensed Android SDK; see ci.yml for
      # why android-actions/setup-android is not used here.
      - name: Install required Android SDK platform
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      # Required for hardware-accelerated emulation on GitHub-hosted Linux
      # runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # NOTE: E10.I1 (test infrastructure) and the DdlSmokeTest /
      # SqliteStackSpikeTest instrumented tests it will add have not landed
      # yet, so this currently exercises the pipeline (emulator boot + APK
      # install + connectedAndroidTest task success) with zero or few tests.
      # It will start asserting real device behavior once those tests exist
      # — no workflow change needed then.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDevDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connected-test-reports
          path: |
            **/build/reports/androidTests/connected/**
            **/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 14
