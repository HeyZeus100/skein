concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz-placeholder:
    name: GGUF fuzz harness (pending E10.I7)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
