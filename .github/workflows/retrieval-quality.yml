name: Retrieval relevance quality

# Replays of the frozen validation set are regressions, never fresh holdouts.
# Missing production vectors remain an independent INELIGIBLE hybrid boundary.
# Hosted runner time is opt-in. See docs/LOCAL_VERIFICATION.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retrieval-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Enforce frozen relevance quality
    uses: ./.github/workflows/retrieval-diagnostic.yml
    with:
      require_quality: true
