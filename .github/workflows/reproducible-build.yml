name: Reproducible build check

# On a release tag, build the unsigned foss release APK twice from clean
# checkouts and require the two to be byte-identical, per spec §10. The
# recipe, the must-match toolchain and how to reproduce this locally are
# documented in docs/VERIFICATION.md § "Build reproducibility".
# This does not sign the APK and never touches a keystore — see E1.I8 for
# the signed release pipeline.
#
# skein-8jtj re-verified this after E1.I11 (skein-4je) turned on R8 for the
# release build type: two clean builds of the same commit are byte-identical
# (716/716 entries), and so is a build from a separate clone at a different
# path, once `vcsInfo { include = false }` stops AGP embedding
# META-INF/version-control-info.textproto. The native .so determinism work
# (E1.I4/E1.I5, skein-ej1b) has landed, so this job is now expected to pass
# rather than to fail legitimately.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # E0.I7 followup (skein-2lq9): the SQLCipher amalgamation
  # (native/sqlite/amalgamation/{sqlite3.c,sqlite3.h,sqlite3ext.h}) is
  # checked into git rather than regenerated by every build -- see
  # docs/design/AMALGAMATION_POLICY.md. This job is the slow, authoritative
  # check that those committed files are still byte-identical to what the
  # pinned SQLCipher release produces fresh: it downloads the tarball,
  # verifies its sha256, reruns the documented configure/make recipe, and
  # diffs the output. It runs only on release tags (not every PR) because it
  # needs tclsh + a C toolchain and takes on the order of a minute; the fast
  # per-build check (SHA256SUMS.txt vs. files on disk, no network/toolchain)
  # is wired into native/sqlite/CMakeLists.txt and runs on every build via
  # AGP's externalNativeBuild.
  amalgamation-integrity:
    name: Verify SQLCipher amalgamation matches pinned source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0

      - name: Install tclsh (SQLCipher's amalgamation generator)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tcl

      - name: Regenerate amalgamation from pinned SQLCipher release and diff
        run: ./native/sqlite/verify_amalgamation.sh --regenerate

  reproducible-build:
    name: Double-build and diff
    runs-on: ubuntu-latest
    # E1.I4 (skein-ca2) raised this from 30: each of the two builds now also
    # compiles llama.cpp + ggml and ~1100 Vulkan shader variants.
    timeout-minutes: 90
    env:
      # Pin build timestamps to the commit so both builds see identical
      # inputs.
      SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
    steps:
      - name: Checkout (build 1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0
        with:
          # E1.I4: libskein_llama.so is built from third_party/ submodules; the
          # APK this job double-builds contains it.
          submodules: true

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a pre-licensed Android SDK; see ci.yml for
      # why android-actions/setup-android is not used here.
      - name: Install required Android SDK platform
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Negative case first: prove the comparator can actually fail before
      # trusting a green result from it. Without this, "the APKs matched" and
      # "the comparison silently no-opped" look identical in the log.
      - name: Self-test the APK comparator
        run: ./tools/ci/compare-apk-entries.sh --self-test

      # `--no-build-cache` is load-bearing, not a speed knob. Both builds run
      # in one job against the same Gradle build cache, so without it build 2
      # restores `:app:minifyFossReleaseWithR8`, `:app:dexBuilder*` and
      # friends FROM-CACHE — it copies build 1's outputs instead of
      # recomputing them, and the comparison below becomes vacuous. That is
      # exactly the R8 determinism this job exists to check (skein-8jtj), so
      # both builds are forced to re-execute every task.
      - name: Build 1 - assemble foss release
        run: ./gradlew clean :app:assembleFossRelease --no-build-cache --stacktrace

      - name: Build 1 - stash unsigned APK
        run: |
          mkdir -p /tmp/rb-build1
          cp app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk \
             /tmp/rb-build1/

      - name: Build 2 - assemble foss release
        run: ./gradlew clean :app:assembleFossRelease --no-build-cache --stacktrace

      - name: Build 2 - stash unsigned APK
        run: |
          mkdir -p /tmp/rb-build2
          cp app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk \
             /tmp/rb-build2/

      # The contract is still the whole-file sha256, but comparing entry by
      # entry is what makes a failure actionable: it names the offending
      # entries instead of printing two hashes that differ. See the script's
      # header for why this is not just `sha256sum a b`.
      - name: Compare unsigned release APKs entry by entry
        run: |
          ./tools/ci/compare-apk-entries.sh \
            /tmp/rb-build1/app-foss-release-unsigned.apk \
            /tmp/rb-build2/app-foss-release-unsigned.apk \
            "double-build of ${GITHUB_SHA}" | tee /tmp/rb-compare.log
          exit "${PIPESTATUS[0]}"

      - name: Upload comparison report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-entry-diff
          path: /tmp/rb-compare.log
          if-no-files-found: ignore
