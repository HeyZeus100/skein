name: Reproducible build check

# On a release tag, build the foss release APK twice from clean checkouts
# and diff the SHA-256 sums, per spec §10 (docs/REPRODUCIBLE_BUILDS.md).
# This does not sign the APK and never touches a keystore — see E1.I8 for
# the signed release pipeline. Full byte-for-byte reproducibility also
# depends on the native library determinism work in E1.I4/E1.I5; until that
# lands this job may legitimately fail, which is expected and documented.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # E0.I7 followup (skein-2lq9): the SQLCipher amalgamation
  # (native/sqlite/amalgamation/{sqlite3.c,sqlite3.h,sqlite3ext.h}) is
  # checked into git rather than regenerated by every build -- see
  # docs/design/AMALGAMATION_POLICY.md. This job is the slow, authoritative
  # check that those committed files are still byte-identical to what the
  # pinned SQLCipher release produces fresh: it downloads the tarball,
  # verifies its sha256, reruns the documented configure/make recipe, and
  # diffs the output. It runs only on release tags (not every PR) because it
  # needs tclsh + a C toolchain and takes on the order of a minute; the fast
  # per-build check (SHA256SUMS.txt vs. files on disk, no network/toolchain)
  # is wired into native/sqlite/CMakeLists.txt and runs on every build via
  # AGP's externalNativeBuild.
  amalgamation-integrity:
    name: Verify SQLCipher amalgamation matches pinned source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0

      - name: Install tclsh (SQLCipher's amalgamation generator)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tcl

      - name: Regenerate amalgamation from pinned SQLCipher release and diff
        run: ./native/sqlite/verify_amalgamation.sh --regenerate

  reproducible-build:
    name: Double-build and diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pin build timestamps to the commit so both builds see identical
      # inputs.
      SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
    steps:
      - name: Checkout (build 1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.3.0

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners ship a pre-licensed Android SDK; see ci.yml for
      # why android-actions/setup-android is not used here.
      - name: Install required Android SDK platform
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build 1 - assemble foss release
        run: ./gradlew clean assembleFossRelease --stacktrace

      - name: Build 1 - stash APK
        run: |
          mkdir -p /tmp/rb-build1
          cp app/build/outputs/apk/foss/release/*.apk /tmp/rb-build1/

      - name: Build 2 - assemble foss release
        run: ./gradlew clean assembleFossRelease --stacktrace

      - name: Build 2 - stash APK
        run: |
          mkdir -p /tmp/rb-build2
          cp app/build/outputs/apk/foss/release/*.apk /tmp/rb-build2/

      - name: Compare SHA-256
        run: |
          sha1=$(sha256sum /tmp/rb-build1/*.apk | awk '{print $1}')
          sha2=$(sha256sum /tmp/rb-build2/*.apk | awk '{print $1}')
          echo "Build 1 sha256: $sha1"
          echo "Build 2 sha256: $sha2"
          if [ "$sha1" != "$sha2" ]; then
            echo "::error::Reproducible build check FAILED: SHA-256 sums differ between the two builds."
            exit 1
          fi
          echo "Reproducible build check PASSED: identical SHA-256 sums."
